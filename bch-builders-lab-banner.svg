<line x1="64" y1="30" x2="136" y2="30" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round"/>
<path d="M56 195c9-4 17 2 28 0s20-6 34-4 24 6 38 3 24-4 36-2v16c5 24-12 52-34 52h-72c-22 0-39-28-34-52v-13z" fill="url(#flaskFill)"/>
<path d="M56 195c9-4 17 2 28 0s20-6 34-4 24 6 38 3 24-4 36-2" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<text x="100" y="250" font-family="'Space Grotesk',sans-serif" font-size="52" font-weight="700" fill="#4ADE80" text-anchor="middle">₿</text>
<circle cx="96" cy="130" r="4" fill="#4ADE80" opacity="0.9"/>
<circle cx="108" cy="105" r="3" fill="#4ADE80" opacity="0.7"/>
